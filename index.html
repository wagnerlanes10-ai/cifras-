<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Minhas Cifras</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fafafa;color:#222;font-size:16px;padding-bottom:70px}
body.dark{background:#141414;color:#e8e8e8}
header{padding:10px 14px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #0001;position:sticky;top:0;background:inherit;z-index:10}
body.dark header{border-color:#fff1}
h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:#2563eb;color:#fff;border:0;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
button.ghost{background:transparent;color:inherit;border:1px solid #0002}
body.dark button.ghost{border-color:#fff3}
button.danger{background:#dc2626}
main{padding:14px;max-width:720px;margin:0 auto}
.search{width:100%;padding:10px;border-radius:8px;border:1px solid #0002;background:#fff;color:#111;font-size:15px;margin-bottom:10px;font-family:inherit}
body.dark .search{background:#1e1e1e;color:#eee;border-color:#fff3}
.song-item{padding:12px 4px;border-bottom:1px solid #0001;display:flex;align-items:center;gap:8px;background:inherit}
body.dark .song-item{border-color:#fff1}
.song-item.drag-over{border-top:2px solid #2563eb}
.song-item.dragging{opacity:0.5}
.song-item .info{flex:1;min-width:0;cursor:pointer}
.song-item h3{margin:0 0 2px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-item small{opacity:.6}
.star{background:transparent;border:0;font-size:20px;padding:4px;cursor:pointer;color:inherit}
.move-btn{background:transparent;color:inherit;border:1px solid #0002;padding:4px 8px;border-radius:6px;font-size:16px}
body.dark .move-btn{border-color:#fff3}
.line{line-height:1.75;margin:0 0 2px;display:flex;flex-wrap:wrap}
.seg{display:inline-flex;flex-direction:column;vertical-align:bottom}
.chord{color:#d81b60;font-weight:700;font-size:.82em;white-space:pre;line-height:1.2;min-height:1.2em}
body.dark .chord{color:#ff7eb3}
.lyric{white-space:pre-wrap}
.section{font-weight:600;margin:16px 0 4px;opacity:.7;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.badge{background:#2563eb;color:#fff;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:600}
textarea{width:100%;min-height:40vh;font-family:ui-monospace,monospace;font-size:14px;padding:10px;border-radius:8px;border:1px solid #0002;background:#fff;color:#111;resize:vertical}
body.dark textarea{background:#1e1e1e;color:#eee;border-color:#fff3}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #0002;margin-bottom:8px;background:#fff;color:#111;font-size:15px;font-family:inherit}
body.dark input[type=text]{background:#1e1e1e;color:#eee;border-color:#fff3}
.player{position:fixed;bottom:60px;left:0;right:0;background:inherit;border-top:1px solid #0001;padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:9}
body.dark .player{border-color:#fff1}
.player input[type=range]{flex:1}

/* ===== NAV BAR INFERIOR ===== */
.navbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:inherit;border-top:1px solid #0001;display:flex;justify-content:space-around;align-items:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
body.dark .navbar{border-color:#fff1}
.nav-btn{background:transparent;color:#888;border:none;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:4px;padding:8px}
.nav-btn.active{color:#2563eb;font-weight:bold}
.nav-btn svg{width:24px;height:24px;fill:currentColor}

/* ===== FERRAMENTAS ===== */
.tool-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0001;text-align:center}
body.dark .tool-card{background:#1e1e1e;box-shadow:0 2px 8px #0005}
.bpm-display{font-size:48px;font-weight:bold;color:#2563eb;margin:10px 0}
.tuner-note{font-size:64px;font-weight:bold;margin:10px 0}
.tuner-status{height:30px;font-size:16px;font-weight:bold}
.tuner-status.in-tune{color:#22c55e}
.tuner-status.off-tune{color:#ef4444}
</style>
</head>
<body>

<header id="header"></header>
<main id="app"></main>
<div class="player" id="player" hidden></div>

<!-- MENU INFERIOR -->
<div class="navbar" id="navbar">
  <button class="nav-btn" data-nav="list" onclick="navTo('list')">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    Cifras
  </button>
  <button class="nav-btn" data-nav="setlists" onclick="navTo('setlists')">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    Setlists
  </button>
  <button class="nav-btn" data-nav="tools" onclick="navTo('tools')">
    <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
    Ferramentas
  </button>
</div>

<script>
const LS_SONGS = 'cifras.v3_songs';
const LS_LISTS = 'cifras.v3_setlists';

const state = {
  songs: JSON.parse(localStorage.getItem(LS_SONGS) || '[]'),
  setlists: JSON.parse(localStorage.getItem(LS_LISTS) || '[]'),
  view: 'list', currentId: null, currentListId: null,
  transpose: 0, capo: 0, flats: false, playing: false, speed: 1.0, font: 1.0,
  dark: localStorage.getItem('dark') === '1',
  search: '', filter: 'all', sortMode: false
};

const saveSongs = () => localStorage.setItem(LS_SONGS, JSON.stringify(state.songs));
const saveLists = () => localStorage.setItem(LS_LISTS, JSON.stringify(state.setlists));
document.body.classList.toggle('dark', state.dark);

// ===== TRANSPOSIÇÃO E PARSER =====
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const CH_RE=/^([A-G])([#b]?)(.*?)(?:\/([A-G])([#b]?))?$/;
const ni=(l,a)=>(BASE[l]+(a==='#'?1:a==='b'?-1:0)+12)%12;
function tp(c,semi,flats){
  const m=c.match(CH_RE);if(!m)return c;
  const t=flats?FLAT:SHARP; const[,r,ra,suf,br,ba]=m;
  let o=t[(ni(r,ra)+semi+120)%12]+suf;
  if(br)o+='/'+t[(ni(br,ba)+semi+120)%12]; return o;
}
function parseLine(line){
  const parts=[];const before=line.split('[')[0]; if(before)parts.push({chord:'',text:before});
  const re=/\[([^\]]*)\]([^\[]*)/g;let m;
  while((m=re.exec(line)))parts.push({chord:m[1],text:m[2]}); return parts;
}
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== NAVEGAÇÃO =====
function navTo(view) {
  state.view = view;
  if (view === 'setlists') state.currentListId = null;
  render();
}

function render() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const activeNav = ['list','read','edit','bulk'].includes(state.view) ? 'list' : (state.view.includes('setlist') ? 'setlists' : 'tools');
  const navBtn = document.querySelector(`.nav-btn[data-nav="${activeNav}"]`);
  if(navBtn) navBtn.classList.add('active');
  
  if(state.playing && activeNav !== 'list') { state.playing = false; stopScroll(); }

  if (state.view === 'list') return renderList();
  if (state.view === 'read') return renderRead();
  if (state.view === 'edit') return renderEdit();
  if (state.view === 'bulk') return renderBulk();
  if (state.view === 'setlists') return renderSetlists();
  if (state.view === 'setlist_detail') return renderSetlistDetail();
  if (state.view === 'tools') return renderTools();
}

// ===== LISTA DE CIFRAS =====
function renderList(){
  const h=$('#header'),a=$('#app'); $('#player').hidden=true; releaseWakeLock();
  h.innerHTML=`<h1>Minhas cifras</h1><button class="ghost" id="dk">${state.dark?'☀️':'🌙'}</button><button class="ghost" id="sort-btn" style="${state.sortMode?'background:#2563eb;color:#fff':''}">${state.sortMode?'Pronto':'Ordenar'}</button><button id="add">+ Nova</button>`;
  $('#dk').onclick=()=>{state.dark=!state.dark;localStorage.setItem('dark',state.dark?'1':'0');document.body.classList.toggle('dark',state.dark);render()};
  $('#sort-btn').onclick=()=>{state.sortMode=!state.sortMode;render()};
  $('#add').onclick=()=>{state.currentId=null;state.sortMode=false;state.view='edit';render()};

  a.innerHTML=`
    <input class="search" id="q" type="text" placeholder="Buscar por título ou artista" value="${esc(state.search)}">
    <div class="toolbar"><button class="ghost" data-f="all" style="${state.filter==='all'?'background:#2563eb;color:#fff':''}">Todas</button><button class="ghost" data-f="fav" style="${state.filter==='fav'?'background:#2563eb;color:#fff':''}">⭐ Favoritas</button></div>
    <div id="list"></div>
    <div style="display:flex;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid #0002;flex-wrap:wrap">
      <button class="ghost" id="bulk" style="flex:1 1 100%;border-color:#2563eb;color:#2563eb;margin-bottom:8px">✨ Importar Texto (PDF/Web)</button>
      <button class="ghost" id="exp" style="flex:1">⬇️ Backup</button>
      <button class="ghost" id="imp" style="flex:1">⬆️ Restaurar</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>`;

  function drawList(){
    const q=state.search.toLowerCase();
    let list=state.songs.filter(s=>s.title.toLowerCase().includes(q)||(s.artist||'').toLowerCase().includes(q));
    if(state.filter==='fav')list=list.filter(s=>s.fav);
    
    $('#list').innerHTML=list.length?list.map(s=>`
      <div class="song-item" data-id="${s.id}" draggable="${state.sortMode}">
        <div class="info" ${state.sortMode ? 'style="pointer-events:none"' : ''}><h3>${esc(s.title)}</h3><small>${esc(s.artist||'')}${s.artist?' · ':''}tom ${esc(s.key||'C')}</small></div>
        <button class="star" data-star="${s.id}" ${state.sortMode ? 'style="display:none"' : ''}>${s.fav?'⭐':'☆'}</button>
        ${state.sortMode ? `<div style="display:flex;gap:4px"><button class="move-btn" data-move="up" data-id="${s.id}">↑</button><button class="move-btn" data-move="down" data-id="${s.id}">↓</button></div>` : ''}
      </div>`).join(''):'<p style="text-align:center;opacity:.55;margin:40px 0">Nenhuma cifra aqui.<br>Toque em <b>+ Nova</b>.</p>';

    document.querySelectorAll('.song-item .info').forEach(el=>{ el.onclick=()=>{ if(state.sortMode)return; state.currentId=el.parentElement.dataset.id; state.transpose=0;state.capo=0;state.playing=false;state.font=1; state.view='read';render();requestWakeLock(); }; });
    document.querySelectorAll('[data-star]').forEach(b=>{ b.onclick=e=>{ e.stopPropagation(); const s=state.songs.find(x=>x.id===b.dataset.star); if(s){s.fav=!s.fav;saveSongs();b.textContent=s.fav?'⭐':'☆'} }; });
    
    document.querySelectorAll('[data-move]').forEach(b=>{ b.onclick=e=>{ e.stopPropagation(); const id=b.dataset.id; const dir=b.dataset.move; const index=state.songs.findIndex(x=>x.id===id);
      if(dir==='up' && index>0){ [state.songs[index], state.songs[index-1]] = [state.songs[index-1], state.songs[index]]; saveSongs(); render(); }
      else if(dir==='down' && index<state.songs.length-1){ [state.songs[index], state.songs[index+1]] = [state.songs[index+1], state.songs[index]]; saveSongs(); render(); }
    };});
    if(state.sortMode){
      document.querySelectorAll('.song-item').forEach(item=>{
        item.ondragstart=e=>{e.dataTransfer.setData('text/plain', item.dataset.id);item.classList.add('dragging');};
        item.ondragend=()=>item.classList.remove('dragging');
        item.ondragover=e=>{e.preventDefault();item.classList.add('drag-over');};
        item.ondragleave=()=>item.classList.remove('drag-over');
        item.ondrop=e=>{e.preventDefault();item.classList.remove('drag-over');const draggedId=e.dataTransfer.getData('text/plain');const targetId=item.dataset.id;if(draggedId===targetId)return;const dragIdx=state.songs.findIndex(s=>s.id===draggedId);const dropIdx=state.songs.findIndex(s=>s.id===targetId);const [dragged]=state.songs.splice(dragIdx,1);state.songs.splice(dropIdx,0,dragged);saveSongs();render();};
      });
    }
  }
  drawList();
  $('#q').oninput=e=>{state.search=e.target.value;drawList()};
  a.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;render()});
  $('#bulk').onclick=()=>{state.view='bulk';render()};
  $('#exp').onclick=exportData; $('#imp').onclick=()=>$('#file').click(); $('#file').onchange=e=>importData(e.target.files[0]);
}

// ===== SETLISTS =====
function renderSetlists(){
  $('#player').hidden=true; releaseWakeLock();
  const h=$('#header'), a=$('#app');
  h.innerHTML=`<h1>Meus Setlists</h1><button id="new-setlist">+ Novo</button>`;
  $('#new-setlist').onclick = () => {
    const name = prompt("Nome do Setlist (ex: Culto Domingo):");
    if(name) { state.setlists.push({ id: Date.now().toString(36), name, songIds: [] }); saveLists(); render(); }
  };

  a.innerHTML = state.setlists.length ? state.setlists.map(l => `
    <div class="song-item" data-listid="${l.id}">
      <div class="info" onclick="openSetlist('${l.id}')">
        <h3>${esc(l.name)}</h3>
        <small>${l.songIds.length} música(s)</small>
      </div>
      <button class="ghost danger" style="padding:4px 8px;border:none" onclick="deleteSetlist('${l.id}')">🗑️</button>
    </div>
  `).join('') : '<p style="text-align:center;opacity:.55;margin:40px 0">Nenhum setlist criado.</p>';
}

window.openSetlist = (id) => { state.currentListId = id; state.view = 'setlist_detail'; render(); }
window.deleteSetlist = (id) => {
  if(confirm("Apagar este setlist?")) { state.setlists = state.setlists.filter(l => l.id !== id); saveLists(); render(); }
}

function renderSetlistDetail(){
  const list = state.setlists.find(l => l.id === state.currentListId);
  if(!list) return navTo('setlists');
  $('#player').hidden=true;
  const h=$('#header'), a=$('#app');
  h.innerHTML=`<button class="ghost" id="back">←</button><h1>${esc(list.name)}</h1>`;
  $('#back').onclick=()=>navTo('setlists');

  // Busca as músicas na ordem do setlist
  let listSongs = list.songIds.map(id => state.songs.find(s => s.id === id)).filter(s => s);

  a.innerHTML = `
    <button id="add-to-list" style="width:100%;margin-bottom:16px">+ Adicionar Música</button>
    <div id="list-songs">
      ${listSongs.length ? listSongs.map((s, idx) => `
        <div class="song-item">
          <div class="info" onclick="playFromSetlist('${s.id}')">
            <h3>${idx+1}. ${esc(s.title)}</h3>
            <small>${esc(s.artist||'')} · tom ${esc(s.key||'C')}</small>
          </div>
          <button class="ghost" onclick="removeFromSetlist('${s.id}')" style="border:none;padding:8px">❌</button>
          <button class="ghost" onclick="moveInSetlist(${idx}, -1)" style="border:none;padding:8px">↑</button>
          <button class="ghost" onclick="moveInSetlist(${idx}, 1)" style="border:none;padding:8px">↓</button>
        </div>
      `).join('') : '<p style="text-align:center;opacity:.5;margin-top:20px">Nenhuma música adicionada.</p>'}
    </div>
  `;

  $('#add-to-list').onclick = () => {
    const availSongs = state.songs.filter(s => !list.songIds.includes(s.id));
    if(!availSongs.length) return alert("Todas as músicas do seu repertório já estão neste setlist!");
    
    // Cria um "Modal" simples para escolher a música
    const modalHtml = `
      <div id="modal" style="position:fixed;inset:0;background:#000a;z-index:100;display:flex;flex-direction:column;padding:20px;padding-top:60px">
        <div style="background:inherit;border-radius:12px;padding:16px;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px">
          <h2 style="margin:0 0 10px 0;font-size:18px">Escolha a música:</h2>
          ${availSongs.map(s => `<button class="ghost" style="text-align:left;padding:12px" onclick="addSongToList('${s.id}')">${esc(s.title)}</button>`).join('')}
          <button class="danger" style="margin-top:20px" onclick="document.getElementById('modal').remove()">Cancelar</button>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
  };
}

window.playFromSetlist = (songId) => {
  state.currentId = songId;
  state.transpose = 0; state.capo = 0; state.font = 1;
  state.view = 'read'; render(); requestWakeLock();
}
window.addSongToList = (songId) => {
  const list = state.setlists.find(l => l.id === state.currentListId);
  list.songIds.push(songId); saveLists();
  document.getElementById('modal').remove(); renderSetlistDetail();
}
window.removeFromSetlist = (songId) => {
  const list = state.setlists.find(l => l.id === state.currentListId);
  list.songIds = list.songIds.filter(id => id !== songId); saveLists(); renderSetlistDetail();
}
window.moveInSetlist = (idx, dir) => {
  const list = state.setlists.find(l => l.id === state.currentListId);
  if(dir === -1 && idx > 0) { [list.songIds[idx], list.songIds[idx-1]] = [list.songIds[idx-1], list.songIds[idx]]; saveLists(); renderSetlistDetail(); }
  if(dir === 1 && idx < list.songIds.length - 1) { [list.songIds[idx], list.songIds[idx+1]] = [list.songIds[idx+1], list.songIds[idx]]; saveLists(); renderSetlistDetail(); }
}

// ===== FERRAMENTAS (METRÔNOMO E AFINADOR) =====
function renderTools(){
  $('#player').hidden=true; releaseWakeLock();
  const h=$('#header'), a=$('#app');
  h.innerHTML=`<h1>Ferramentas</h1>`;

  a.innerHTML = `
    <div class="tool-card">
      <h3 style="margin-top:0">Metrônomo</h3>
      <div class="bpm-display" id="bpm-display">120</div>
      <input type="range" id="bpm-slider" min="40" max="240" value="120" style="width:100%;margin-bottom:16px">
      <div style="display:flex;gap:10px;justify-content:center">
        <button id="btn-metro" style="width:100px;height:50px;font-size:16px;border-radius:25px">Iniciar</button>
      </div>
    </div>

    <div class="tool-card">
      <h3 style="margin-top:0">Afinador (Violão/Guitarra)</h3>
      <div class="tuner-note" id="tuner-note">-</div>
      <div class="tuner-status" id="tuner-status">Aguardando...</div>
      <button id="btn-tuner" style="width:100%;margin-top:16px">Ativar Microfone</button>
      <p style="font-size:12px;opacity:.5;margin-top:10px">Toque a corda perto do microfone.</p>
    </div>
  `;

  // === Lógica do Metrônomo ===
  let audioCtx = window.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  window.audioCtx = audioCtx;
  let isMetroPlaying = false;
  let bpm = 120;
  let nextNoteTime = 0.0;
  let timerID;
  
  const btnMetro = $('#btn-metro');
  const bpmDisplay = $('#bpm-display');
  const bpmSlider = $('#bpm-slider');

  bpmSlider.oninput = (e) => {
    bpm = parseInt(e.target.value);
    bpmDisplay.textContent = bpm;
  };

  function nextNote() { nextNoteTime += 60.0 / bpm; }
  function scheduleNote(beatNumber, time) {
    const osc = audioCtx.createOscillator();
    const envelope = audioCtx.createGain();
    osc.frequency.value = (beatNumber % 4 === 0) ? 1000 : 800; // Som mais agudo no 1º tempo
    envelope.gain.value = 1;
    envelope.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    osc.connect(envelope); envelope.connect(audioCtx.destination);
    osc.start(time); osc.stop(time + 0.05);
  }
  function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + 0.1) {
      scheduleNote(0, nextNoteTime); // Simplificado, sem contar os 4 tempos visualmente
      nextNote();
    }
    timerID = setTimeout(scheduler, 25);
  }

  btnMetro.onclick = () => {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(isMetroPlaying) {
      clearTimeout(timerID); btnMetro.textContent = 'Iniciar'; btnMetro.classList.remove('danger'); isMetroPlaying = false;
    } else {
      nextNoteTime = audioCtx.currentTime + 0.1; isMetroPlaying = true; scheduler();
      btnMetro.textContent = 'Parar'; btnMetro.classList.add('danger');
    }
  };

  // === Lógica do Afinador ===
  let isTunerOn = false;
  let analyser, dataArray;
  let tunerReq;
  
  const btnTuner = $('#btn-tuner');
  const noteDisplay = $('#tuner-note');
  const statusDisplay = $('#tuner-status');

  btnTuner.onclick = async () => {
    if(isTunerOn) {
      cancelAnimationFrame(tunerReq);
      if(analyser) analyser.disconnect();
      btnTuner.textContent = 'Ativar Microfone'; btnTuner.classList.remove('danger');
      noteDisplay.textContent = '-'; statusDisplay.textContent = 'Desligado'; statusDisplay.className = 'tuner-status';
      isTunerOn = false;
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if(!analyser) {
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Float32Array(analyser.fftSize);
      }
      if(audioCtx.state === 'suspended') audioCtx.resume();
      isTunerOn = true;
      btnTuner.textContent = 'Desligar'; btnTuner.classList.add('danger');
      statusDisplay.textContent = 'Ouvindo...';
      updateTuner();
    } catch(e) {
      alert("Erro ao acessar o microfone. Verifique as permissões do navegador.");
    }
  };

  function autoCorrelate(buf, sampleRate) {
    let SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) { rms += buf[i] * buf[i]; }
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1;
    let r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
    for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    buf = buf.slice(r1, r2); SIZE = buf.length;
    let c = new Array(SIZE).fill(0);
    for (let i = 0; i < SIZE; i++) { for (let j = 0; j < SIZE - i; j++) { c[i] = c[i] + buf[j] * buf[j + i]; } }
    let d = 0; while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }
    let T0 = maxpos;
    let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
    let a = (x1 + x3 - 2 * x2) / 2;
    let b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);
    return sampleRate / T0;
  }

  const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

  function updateTuner() {
    if(!isTunerOn) return;
    analyser.getFloatTimeDomainData(dataArray);
    let freq = autoCorrelate(dataArray, audioCtx.sampleRate);
    
    if (freq > 50 && freq < 1000) {
      let noteNum = 12 * (Math.log(freq / 440) / Math.log(2));
      let roundedNote = Math.round(noteNum) + 69;
      let noteName = noteStrings[roundedNote % 12];
      let cents = Math.floor((noteNum - Math.round(noteNum)) * 100);
      
      noteDisplay.textContent = noteName;
      
      if (Math.abs(cents) <= 5) {
        statusDisplay.textContent = 'Afinado 🎯';
        statusDisplay.className = 'tuner-status in-tune';
      } else if (cents < 0) {
        statusDisplay.textContent = `Aperte a corda (${cents} cents)`;
        statusDisplay.className = 'tuner-status off-tune';
      } else {
        statusDisplay.textContent = `Afrouxe a corda (+${cents} cents)`;
        statusDisplay.className = 'tuner-status off-tune';
      }
    } else {
      if(statusDisplay.textContent !== 'Ouvindo...') {
        noteDisplay.textContent = '-'; statusDisplay.textContent = 'Ouvindo...'; statusDisplay.className = 'tuner-status';
      }
    }
    tunerReq = requestAnimationFrame(updateTuner);
  }
}

// ===== LEITURA E EDIÇÃO (mantidos iguais) =====
function renderRead(){
  const song=state.songs.find(s=>s.id===state.currentId); if(!song){state.view='list';return render()}
  const h=$('#header'),a=$('#app'),p=$('#player');
  const semis=state.transpose-state.capo; const realKey=tp(song.key||'C',state.transpose,state.flats); const capoLabel=state.capo?` · capo ${state.capo}`:'';
  h.innerHTML=`<button class="ghost" id="back">←</button><h1>${esc(song.title)}</h1><button class="ghost" id="edit">✏️</button>`;
  $('#back').onclick=()=>{state.playing=false;stopScroll();state.view=(state.currentListId)?'setlist_detail':'list';render()};
  $('#edit').onclick=()=>{state.playing=false;stopScroll();state.view='edit';render()};
  const html=song.body.split('\n').map(line=>{
    const t=line.trim(); if(!t)return '<div style="height:8px"></div>';
    if(/^\{.*\}$/.test(t))return `<div class="section">${esc(t.slice(1,-1))}</div>`;
    const segs=parseLine(line).map(s=>`<span class="seg"><span class="chord">${s.chord?esc(tp(s.chord,semis,state.flats)):'&nbsp;'}</span><span class="lyric">${esc(s.text)||'&nbsp;'}</span></span>`).join('');
    return `<div class="line">${segs}</div>`;
  }).join('');
  a.innerHTML=`<div class="controls"><button class="ghost" id="tm">−</button><span style="padding:6px 2px"><span class="badge">${esc(realKey)}</span>${capoLabel}</span><button class="ghost" id="tp">+</button><button class="ghost" id="cm">capo −</button><button class="ghost" id="cp">capo +</button><button class="ghost" id="acc">${state.flats?'♭':'♯'}</button><button class="ghost" id="fm">A−</button><button class="ghost" id="fp">A+</button></div><div id="content" style="font-size:${state.font}em">${html}</div>`;
  $('#tm').onclick=()=>{state.transpose--;render()}; $('#tp').onclick=()=>{state.transpose++;render()}; $('#cm').onclick=()=>{state.capo=Math.max(0,state.capo-1);render()}; $('#cp').onclick=()=>{state.capo=Math.min(12,state.capo+1);render()}; $('#acc').onclick=()=>{state.flats=!state.flats;render()}; $('#fm').onclick=()=>{state.font=Math.max(0.7,state.font-0.1);render()}; $('#fp').onclick=()=>{state.font=Math.min(1.8,state.font+0.1);render()};
  p.hidden=false; p.innerHTML=`<button class="ghost" id="play" style="min-width:44px">${state.playing?'⏸':'▶'}</button><input type="range" id="spd" min="0.3" max="3" step="0.1" value="${state.speed}"><span style="font-size:12px;opacity:.7;min-width:34px;text-align:right">${state.speed.toFixed(1)}x</span>`;
  $('#play').onclick=()=>{state.playing=!state.playing;if(state.playing)startScroll();else stopScroll();$('#play').textContent=state.playing?'⏸':'▶'};
  $('#spd').oninput=e=>{state.speed=parseFloat(e.target.value);e.target.nextElementSibling.textContent=state.speed.toFixed(1)+'x'}; if(state.playing)startScroll();
}

function renderEdit(){
  const song=state.currentId?state.songs.find(s=>s.id===state.currentId):null; $('#player').hidden=true; releaseWakeLock(); const h=$('#header'),a=$('#app');
  h.innerHTML=`<button class="ghost" id="back">←</button><h1>${song?'Editar':'Nova cifra'}</h1>`;
  $('#back').onclick=()=>{state.view=song?'read':'list';render()};
  a.innerHTML=`<input type="text" id="ttl" placeholder="Título" value="${song?esc(song.title):''}"><input type="text" id="art" placeholder="Artista" value="${song?esc(song.artist||''):''}"><input type="text" id="key" placeholder="Tom (ex: C, Am, F#m)" value="${song?esc(song.key||''):''}"><p style="font-size:12px;opacity:.6;margin:4px 0 8px">Use <b>[C]</b> antes da sílaba onde o acorde entra.</p><textarea id="body">${song?esc(song.body):''}</textarea><div style="display:flex;gap:8px;margin-top:12px"><button id="sv" style="flex:1">Salvar</button>${song?'<button class="ghost" id="del">Excluir</button>':''}</div>`;
  if(song)$('#del').onclick=()=>{if(!confirm('Excluir essa cifra?'))return;state.songs=state.songs.filter(s=>s.id!==song.id);saveSongs();state.view='list';render()};
  $('#sv').onclick=()=>{const title=$('#ttl').value.trim(); const body=$('#body').value;if(!title||!body)return alert('Título e cifra são obrigatórios');const data={title,artist:$('#art').value.trim(),key:$('#key').value.trim()||'C',body};if(song){Object.assign(song,data);state.view='read'}else{const id=Date.now().toString(36);state.songs.unshift({id,...data,fav:false});state.currentId=id;state.view='read'}saveSongs();render();};
}

function renderBulk(){
  $('#player').hidden=true; const h=$('#header'),a=$('#app');
  h.innerHTML=`<button class="ghost" id="back">←</button><h1>Importar de PDF/Texto</h1>`;
  $('#back').onclick=()=>{state.view='list';render()};
  a.innerHTML=`<p style="font-size:13px;opacity:.7;margin-bottom:12px">Cole o texto puro da cifra. O robô vai alinhar os acordes automaticamente.</p><input type="text" id="b_title" placeholder="Título da Música"><input type="text" id="b_artist" placeholder="Artista (opcional)"><textarea id="b_text" placeholder="Cole o texto aqui..." style="min-height:40vh"></textarea><button id="b_save" style="width:100%;margin-top:12px;padding:12px">Processar e Salvar</button>`;
  $('#b_save').onclick=()=>{
    const title=$('#b_title').value.trim(); const artist=$('#b_artist').value.trim(); const raw=$('#b_text').value;
    if(!title||!raw)return alert('Título e texto são obrigatórios');
    let lines=raw.split('\n'); let result=[];
    const chordLineRegex=/^[A-G][#b]?(?:m|maj|min|dim|aug|sus|add|M|º|°)?[0-9]*(?:\([0-9a-zA-Z#b,]+\))?(?:\/[A-G][#b]?)?(?:\s+[A-G][#b]?(?:m|maj|min|dim|aug|sus|add|M|º|°)?[0-9]*(?:\([0-9a-zA-Z#b,]+\))?(?:\/[A-G][#b]?)?)*\s*$/;
    const singleChordRegex=/[A-G][#b]?(?:m|maj|min|dim|aug|sus|add|M|º|°)?[0-9]*(?:\([0-9a-zA-Z#b,]+\))?(?:\/[A-G][#b]?)?/g;
    for(let i=0; i<lines.length; i++){
      let line=lines[i]; let nextLine=lines[i+1]||'';
      if(chordLineRegex.test(line.trim()) && line.trim().length>0 && nextLine.trim().length>0 && !chordLineRegex.test(nextLine.trim())){
        let chords=[...line.matchAll(singleChordRegex)];
        if(chords.length>0){let newLyric=''; let lastIndex=0; chords.forEach(m=>{let idx=Math.min(m.index, nextLine.length); newLyric += nextLine.substring(lastIndex, idx) + `[${m[0]}]`; lastIndex=idx;}); newLyric += nextLine.substring(lastIndex); result.push(newLyric); i++; continue;}
      }
      if(chordLineRegex.test(line.trim()) && line.trim().length>0 && (nextLine.trim().length===0 || chordLineRegex.test(nextLine.trim()))){result.push(line.replace(singleChordRegex, '[$&]')); continue;}
      result.push(line);
    }
    const newId=Date.now().toString(36);
    state.songs.unshift({id: newId,title: title,artist: artist,key: 'C',body: result.join('\n'),fav: false});
    saveSongs(); state.currentId = newId; state.view = 'read'; render();
  };
}

// ===== AUTOSCROLL E BACKUP =====
let raf=null;
function stopScroll(){if(raf)cancelAnimationFrame(raf);raf=null}
function startScroll(){stopScroll();let last=performance.now(),acc=0;const step=now=>{if(!state.playing){raf=null;return}acc+=state.speed*30*(now-last)/1000;last=now;if(acc>=1){window.scrollBy(0,Math.floor(acc));acc%=1}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
let wakeLock=null;
async function requestWakeLock(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch{}}
function releaseWakeLock(){if(wakeLock){wakeLock.release();wakeLock=null}}

function exportData(){
  const data = { songs: state.songs, setlists: state.setlists };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`cifras-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(Array.isArray(data)) { // Backup antigo (só músicas)
        if(confirm(`Importar ${data.length} cifra(s) antigas?`)){ state.songs=data.concat(state.songs); saveSongs(); render(); }
      } else if(data.songs && data.setlists) {
        if(confirm(`Importar backup completo? (${data.songs.length} músicas e ${data.setlists.length} setlists)`)){
          state.songs=data.songs.concat(state.songs);
          state.setlists=data.setlists.concat(state.setlists);
          saveSongs(); saveLists(); render();
        }
      }
    }catch{alert('Arquivo inválido')}
  };
  fr.readAsText(file);
}

render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
